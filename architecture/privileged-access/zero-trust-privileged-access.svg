t><text x="66" y="101" text-anchor="middle" class="m s">Temporary elevation</text><text x="137" y="83" class="b h2">→</text></g><g transform="translate(924,335)"><rect width="132" height="155" rx="14" fill="#f9fcff" stroke="#bfdff7"/><circle cx="66" cy="30" r="19" fill="#1684d8"/><text x="66" y="72" text-anchor="middle" class="n h3">Azure administration</text><text x="66" y="101" text-anchor="middle" class="m s">Portal, API, tools</text></g>
