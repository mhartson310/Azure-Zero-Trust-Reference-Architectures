<g transform="translate(42,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#1699ff"/><text x="98" y="73" text-anchor="middle" class="n h3">Users / Devices</text><text x="98" y="102" text-anchor="middle" class="m s">Employees, partners, apps</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(262,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#1673d9"/><text x="98" y="73" text-anchor="middle" class="n h3">Microsoft Entra ID</text><text x="98" y="102" text-anchor="middle" class="m s">Authentication + claims</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(482,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#1279e8"/><text x="98" y="73" text-anchor="middle" class="n h3">Conditional Access + MFA</text><text x="98" y="102" text-anchor="middle" class="m s">Device, risk, policy checks</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(702,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#118be4"/><text x="98" y="73" text-anchor="middle" class="n h3">Application / API</text><text x="98" y="102" text-anchor="middle" class="m s">Authorize + orchestrate</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(922,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#17a96c"/><text x="98" y="73" text-anchor="middle" class="n h3">Managed Identity</text><text x="98" y="102" text-anchor="middle" class="m s">Secretless workload auth</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(1142,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#6a58df"/><text x="98" y="73" text-anchor="middle" class="n h3">Private Link</text><text x="98" y="102" text-anchor="middle" class="m s">Private service access</text><text x="205" y="67" class="b h2">→</text></g><g transform="translate(1362,345)"><rect width="195" height="130" rx="16" fill="#f9fcff" stroke="#bfdff7"/><circle cx="98" cy="32" r="21" fill="#1486d7"/><text x="98" y="73" text-anchor="middle" class="n h3">Azure Data Services</text><text x="98" y="102" text-anchor="middle" class="m s">Storage, SQL, Key services</text></g>
<rect x="45" y="485" width="1510" height="25" rx="8" fill="#eaf5ff"/><text x="800" y="503" text-anchor="middle" class="b sb">Identity is verified first. Authorization and private access are enforced before sensitive data is reached.</text>

