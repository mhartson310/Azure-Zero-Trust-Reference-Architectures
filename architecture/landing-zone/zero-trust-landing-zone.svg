<g transform="translate(40,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#138cea"/><text x="86" y="72" text-anchor="middle" class="n h3">Tenant / Entra ID</text><text x="86" y="101" text-anchor="middle" class="m s">Identity foundation</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(232,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#2775d6"/><text x="86" y="72" text-anchor="middle" class="n h3">Management Groups</text><text x="86" y="101" text-anchor="middle" class="m s">Policy boundaries</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(424,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#166ee8"/><text x="86" y="72" text-anchor="middle" class="n h3">Azure Policy</text><text x="86" y="101" text-anchor="middle" class="m s">Guardrails + compliance</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(616,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#f0aa00"/><text x="86" y="72" text-anchor="middle" class="n h3">Subscriptions</text><text x="86" y="101" text-anchor="middle" class="m s">Workload separation</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(808,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#25a3e5"/><text x="86" y="72" text-anchor="middle" class="n h3">Hub / Virtual WAN</text><text x="86" y="101" text-anchor="middle" class="m s">Connectivity + inspection</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(1000,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#1b83d6"/><text x="86" y="72" text-anchor="middle" class="n h3">Shared Security Services</text><text x="86" y="101" text-anchor="middle" class="m s">Firewall, DNS, Bastion</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(1192,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#3d78d5"/><text x="86" y="72" text-anchor="middle" class="n h3">Workload Spokes</text><text x="86" y="101" text-anchor="middle" class="m s">Isolated environments</text><text x="179" y="66" class="b h2">→</text></g><g transform="translate(1384,345)"><rect width="172" height="130" rx="15" fill="#f9fcff" stroke="#bfdff7"/><circle cx="86" cy="32" r="20" fill="#1d9ae4"/><text x="86" y="72" text-anchor="middle" class="n h3">Monitor + Sentinel</text><text x="86" y="101" text-anchor="middle" class="m s">Central visibility</text></g>
<rect x="45" y="485" width="1510" height="25" rx="8" fill="#eaf5ff"/><text x="800" y="503" text-anchor="middle" class="b sb">Governance, segmentation, and centralized monitoring are enforced across the platform.</text>

<rect x="28" y="535" width="1544" height="130" rx="22" fill="#fff" stroke="#b7daf7" stroke-width="2"/>
